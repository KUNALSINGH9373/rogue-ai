<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rogue . AI</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="description" content="A tracker of real-world incidents where AI systems went wrong.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root {
    --bg: #f7f4ee;          /* warm cream */
    --card: #fffdf9;
    --fg: #4a4640;          /* soft charcoal, never black */
    --muted: #9a938a;
    --line: #ece6dc;
    --head: #f3eee5;
    --accent: #8fb3a8;      /* sage */
    --l0: #efe9df; --l1: #c3e0d1; --l2: #96c9b0; --l3: #6fb093; --l4: #4f9478;   /* calendar shades */
    --openai-bg: #eef6f1;  --openai-bar: #a8d5bf;  --openai-ink: #5d8a76;
    --anthropic-bg: #fcf1ea; --anthropic-bar: #f2c4a8; --anthropic-ink: #b07a5c;
    --both-bg: #f4f0fa;    --both-bar: #cdbfe6;    --both-ink: #8473a8;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.6 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  header { padding: 28px 24px 8px; max-width: 1600px; margin: 0 auto; display: flex;
           align-items: baseline; gap: 14px; flex-wrap: wrap; }
  header h1 { margin: 0; font: 500 30px/1.1 Fraunces, Georgia, serif; letter-spacing: -0.01em; color: #5a564f; }
  header h1 b { color: var(--accent); font-weight: 500; }
  header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  header h1 { justify-self: start; }
  .hal { display: flex; align-items: center; gap: 10px; }
  .eye { width: 20px; height: 20px; border-radius: 50%; flex: none;
         background: radial-gradient(circle at 50% 50%, #fff3b0 0 8%, #ff5a3c 18%, #c4160c 42%, #4a0505 70%, #1a0202 100%);
         box-shadow: 0 0 0 2px #2b2b2b, 0 0 0 4px #9a9a9a, 0 0 10px 3px #ff2a1a88;
         animation: glow 2.6s ease-in-out infinite; }
  @keyframes glow {
    0%, 100% { box-shadow: 0 0 0 2px #2b2b2b, 0 0 0 4px #9a9a9a, 0 0 8px 2px #ff2a1a66; filter: brightness(.9); }
    50%      { box-shadow: 0 0 0 2px #2b2b2b, 0 0 0 4px #9a9a9a, 0 0 18px 7px #ff2a1aaa; filter: brightness(1.15); }
  }
  @media (prefers-reduced-motion: reduce) { .eye { animation: none; } }
  .hal q { font-family: Fraunces, Georgia, serif; font-style: italic; font-size: 16px; color: #6e6860; }
  .hal small { color: var(--muted); font-size: 12px; }
  main { max-width: 1600px; margin: 0 auto; padding: 0 24px 40px; }
  .bar { padding: 16px 0 10px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .bar input { flex: 1 1 260px; padding: 10px 16px; border: 1px solid var(--line); border-radius: 999px;
               background: var(--card); color: var(--fg); font: inherit; outline: none; transition: border-color .2s, box-shadow .2s; }
  .bar input:focus, tr.filters input:focus, tr.filters select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #8fb3a826; }
  .bar button { padding: 10px 18px; border: 1px solid var(--line); border-radius: 999px;
                background: var(--card); color: var(--fg); cursor: pointer; font: inherit; transition: background .2s; }
  .bar button:hover { background: var(--head); }
  .legend { display: flex; gap: 8px; flex-wrap: wrap; }
  .legend button { padding: 5px 14px; border-radius: 999px; font: inherit; font-size: 12px; font-weight: 500;
                   cursor: pointer; transition: transform .15s, box-shadow .2s, opacity .2s; }
  .legend button:hover { transform: translateY(-1px); }
  .legend.filtering button:not(.active) { opacity: .5; }
  .legend button.active { box-shadow: 0 0 0 3px #ffffff, 0 0 0 4px currentColor; }
  .legend .openai { background: var(--openai-bg); color: var(--openai-ink); border: 1px solid var(--openai-bar); }
  .legend .anthropic { background: var(--anthropic-bg); color: var(--anthropic-ink); border: 1px solid var(--anthropic-bar); }
  .legend .both { background: var(--both-bg); color: var(--both-ink); border: 1px solid var(--both-bar); }
  .status { color: var(--muted); padding: 0 4px 12px; font-size: 12px; }
  .cal { margin-top: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 18px;
         padding: 12px 20px; box-shadow: 0 6px 24px #b5a99212; }
  .cal-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .cal-top h2 { margin: 0; font-size: 14px; font-weight: 500; color: var(--fg); }
  .years { display: flex; gap: 6px; }
  .years button { border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 999px;
                  padding: 3px 12px; font: inherit; font-size: 12px; cursor: pointer; }
  .years button.active { background: #e6f0eb; border-color: #a8d5bf; color: #5d8a76; }
  .cal-scroll { overflow-x: auto; padding-bottom: 4px; }
  .cal-grid { display: grid; grid-template-columns: 28px repeat(var(--weeks), minmax(9px, 14px)); grid-template-rows: 14px;
              gap: 3px; min-width: 640px; justify-content: center; font-size: 10px; color: var(--muted); align-items: center; }
  .cal-grid .m { grid-row: 1; white-space: nowrap; }
  .cal-grid .d { grid-column: 1; }
  .cal-grid .cell { width: 100%; height: auto; aspect-ratio: 1; }
  .cell { width: 12px; height: 12px; border-radius: 3px; background: var(--l0); outline: 1px solid #0000000a; outline-offset: -1px; }
  .cell.has { cursor: pointer; }
  .cell:hover { outline: 1px solid #5d8a76; }
  .cell.sel { outline: 2px solid #5d8a76; }
  .cal-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-size: 11px; color: var(--muted); flex-wrap: wrap; gap: 8px; }
  .scale { display: flex; align-items: center; gap: 3px; }
  .tip { position: fixed; pointer-events: none; background: #5a564f; color: #fffdf9; font-size: 12px; padding: 5px 10px;
         border-radius: 8px; white-space: nowrap; transform: translate(-50%, -100%); opacity: 0; transition: opacity .1s; z-index: 10; }
  .wrap { overflow: auto; max-height: calc(100vh - 170px); background: var(--card); border: 1px solid var(--line);
          border-radius: 18px; box-shadow: 0 6px 24px #b5a99212; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1300px; }
  th, td { border-bottom: 1px solid var(--line); padding: 12px 14px; text-align: left; vertical-align: top; }
  thead { position: sticky; top: 0; z-index: 2; }
  th { background: var(--head); font-weight: 600; font-size: 12px;
       letter-spacing: .04em; text-transform: uppercase; color: #807a71; white-space: nowrap; cursor: pointer; user-select: none; }
  th:hover { color: var(--fg); }
  th .arrow { color: var(--accent); font-size: 10px; }
  tr.filters th { cursor: default; padding: 6px 10px 10px; text-transform: none; letter-spacing: 0; }
  tr.filters input, tr.filters select { width: 100%; min-width: 90px; padding: 6px 10px; font: inherit; font-size: 12px;
         border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg); outline: none; }
  tbody tr { transition: filter .15s; }
  tbody tr:hover { filter: brightness(0.985); }
  tbody tr:last-child td { border-bottom: 0; }
  td.long { min-width: 280px; }
  td:first-child { font-weight: 500; min-width: 220px; }
  td a { display: inline-block; margin: 0 6px 6px 0; padding: 3px 10px; border-radius: 999px; font-size: 12px;
         background: #ffffffb3; border: 1px solid var(--line); color: #6f8f86; text-decoration: none; transition: border-color .2s; }
  td a:hover { border-color: var(--accent); }
  tr.openai td { background: var(--openai-bg); }
  tr.openai td:first-child { box-shadow: inset 4px 0 var(--openai-bar); }
  tr.anthropic td { background: var(--anthropic-bg); }
  tr.anthropic td:first-child { box-shadow: inset 4px 0 var(--anthropic-bar); }
  tr.both td { background: var(--both-bg); }
  tr.both td:first-child { box-shadow: inset 4px 0 var(--both-bar); }
  @media (max-width: 700px) {
    header { grid-template-columns: 1fr; justify-items: center; padding: 18px 16px 4px; gap: 6px; text-align: center; }
    header h1 { font-size: 24px; justify-self: center; }
    .hal { flex-wrap: wrap; justify-content: center; }
    .hal { gap: 8px; } .hal q { font-size: 14px; } .eye { width: 16px; height: 16px; }
    main { padding: 0 16px 24px; }
    .cal { padding: 12px 14px; border-radius: 14px; }
    .cal-top h2 { font-size: 13px; }
    .bar input { flex-basis: 100%; }
    .bar button#reset { padding: 6px 14px; font-size: 13px; }
    /* Table becomes a stack of cards */
    .wrap { overflow: visible; max-height: none; background: none; border: 0; box-shadow: none; border-radius: 0; }
    table, tbody, tbody tr, tbody td { display: block; min-width: 0; width: auto; }
    thead { position: static; display: block; }
    tr#heads { display: none; }
    tr.filters { display: flex; gap: 8px; margin-bottom: 12px; }
    tr.filters th { display: block; flex: 1; padding: 0; background: none; border: 0; }
    tr.filters th:empty { display: none; }
    tr.filters select { padding: 8px 10px; font-size: 13px; border-radius: 999px; }
    tbody tr { margin-bottom: 12px; border: 1px solid var(--line); border-left-width: 4px; border-radius: 14px;
               padding: 10px 0; background: var(--card); overflow: hidden; }
    tbody tr td, tr.openai td, tr.anthropic td, tr.both td { background: none; box-shadow: none !important; border: 0;
               padding: 4px 14px; min-width: 0 !important; }
    tbody td:empty { display: none; }
    tbody td:not(:first-child)::before { content: attr(data-label); display: block; font-size: 10px; font-weight: 600;
               letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
    tbody td:first-child { font-size: 15px; padding-bottom: 6px; }
    tr.openai { background: var(--openai-bg); border-left-color: var(--openai-bar); }
    tr.anthropic { background: var(--anthropic-bg); border-left-color: var(--anthropic-bar); }
    tr.both { background: var(--both-bg); border-left-color: var(--both-bar); }
  }
</style>
</head>
<body>
<header><h1>Rogue <b>.</b> AI</h1><div class="hal" title="HAL 9000, 2001: A Space Odyssey (1968)"><i class="eye"></i><q>I'm sorry, Dave. I'm afraid I can't do that.</q><small>— HAL 9000</small></div></header>

<main>
<section class="cal">
  <div class="cal-top"><h2 id="cal-title">Incidents disclosed</h2><div class="years" id="years"></div></div>
  <div class="cal-scroll"><div class="cal-grid" id="cal-grid"></div></div>
  <div class="cal-foot"><span>Click or tap a day to filter the table</span>
    <span class="scale">Less <i class="cell" style="background:var(--l0)"></i><i class="cell" style="background:var(--l1)"></i><i class="cell" style="background:var(--l2)"></i><i class="cell" style="background:var(--l3)"></i><i class="cell" style="background:var(--l4)"></i> More</span></div>
</section>
<div class="tip" id="tip"></div>
<div class="bar">
  <input id="q" type="search" placeholder="Search incidents…">
  <button id="reset">Clear filters</button>
  <div class="legend">
    <button class="openai" data-company="OpenAI" title="Show only OpenAI incidents">OpenAI</button>
    <button class="anthropic" data-company="Anthropic" title="Show only Anthropic incidents">Anthropic</button>
    <button class="both" data-company="Both" title="Show only incidents involving both">Both</button>
  </div>
</div>
<div class="status" id="status">Loading data from spreadsheet…</div>

<div class="wrap">
  <table>
    <thead><tr id="heads"></tr><tr class="filters" id="filters"></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
</main>

<script>
const SHEET = "https://docs.google.com/spreadsheets/d/15tpVhsFph5AHnAuUsHFBY82zPciBDJzpfQzWKZ_cNP0/gviz/tq?tqx=out:csv&gid=";
const INCIDENTS_GID = "1500637786", SOURCES_GID = "1116836595";

// Columns shown on the site. Internal sheet columns (private notes, discovery keys, etc.) are deliberately left out.
const COLS = [
  { key: "Event title",       type: "text", long: true },
  { key: "Occurrence label",  type: "text", label: "Occurred" },
  { key: "Disclosed on",      type: "text", date: true },
  { key: "Company",           type: "select", derive: companyGroup, plural: "companies" },
  { key: "Model",             type: "text" },
  { key: "Category",          type: "select", plural: "categories" },
  { key: "Incident summary",  type: "text", long: true },
  { key: "Outcome",           type: "text", long: true },
  { key: "Evidence",          type: "text" },
  { key: "Sources",           type: "text", links: true },
];

function companyGroup(c) {
  const o = /openai/i.test(c), a = /anthropic/i.test(c);
  return o && a ? "Both" : o ? "OpenAI" : a ? "Anthropic" : "Other";
}

let data = [], sortKey = "Disclosed on", sortDir = -1;
const filters = {};

// ---- GitHub-style calendar of disclosure dates ----
const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
let selDate = "", calYear = null, scrolledYear = null;
const key = d => `${d.getMonth() + 1}/${d.getDate()}/${d.getFullYear()}`;   // same M/D/YYYY format as the sheet
const fmt = k => { const [m, d, y] = k.split("/"); return `${MONTHS[m - 1]} ${d}, ${y}`; };

function renderCal() {
  const counts = {};
  for (const r of data) { const k = (r["Disclosed on"] || "").trim(); if (k) counts[k] = (counts[k] || 0) + 1; }
  const years = [...new Set(Object.keys(counts).map(k => +k.split("/")[2]))].sort((a, b) => b - a);
  if (calYear === null) calYear = years[0];

  const yb = document.getElementById("years");
  yb.innerHTML = "";
  for (const y of years) {
    const b = document.createElement("button");
    b.textContent = y; b.className = y === calYear ? "active" : "";
    b.onclick = () => { calYear = y; renderCal(); };
    yb.appendChild(b);
  }

  const start = new Date(calYear, 0, 1); start.setDate(start.getDate() - start.getDay());   // back to Sunday
  const end = new Date(calYear, 11, 31);
  const weeks = Math.ceil(((end - start) / 864e5 + 1) / 7);
  const grid = document.getElementById("cal-grid");
  grid.style.setProperty("--weeks", weeks);
  grid.innerHTML = "";
  ["", "Mon", "", "Wed", "", "Fri", ""].forEach((t, i) => {
    const el = document.createElement("span"); el.className = "d"; el.textContent = t; el.style.gridRow = i + 2; grid.appendChild(el);
  });

  let total = 0;
  const tip = document.getElementById("tip");
  for (let d = new Date(start), i = 0; d <= end; d.setDate(d.getDate() + 1), i++) {
    const col = Math.floor(i / 7) + 2;
    if (d.getFullYear() !== calYear) continue;
    if (d.getDate() === 1) {   // month label above the week where the month starts
      const m = document.createElement("span"); m.className = "m"; m.textContent = MONTHS[d.getMonth()];
      m.style.gridColumn = `${col} / span 3`; grid.appendChild(m);
    }
    const k = key(d), n = counts[k] || 0;
    total += n;
    const c = document.createElement("i");
    c.className = "cell" + (n ? " has" : "") + (k === selDate ? " sel" : "");
    c.style.gridColumn = col; c.style.gridRow = d.getDay() + 2;
    if (n) c.style.background = `var(--l${Math.min(n, 4)})`;
    const label = `${n ? n : "No"} incident${n === 1 ? "" : "s"} on ${fmt(k)}`;
    c.onmouseenter = () => { const r = c.getBoundingClientRect(); tip.textContent = label;
      tip.style.left = r.left + r.width / 2 + "px"; tip.style.top = r.top - 6 + "px"; tip.style.opacity = 1; };
    c.onmouseleave = () => { tip.style.opacity = 0; };
    if (n) c.onclick = () => { selDate = selDate === k ? "" : k; render(); };
    grid.appendChild(c);
  }
  // On narrow screens show the most recent months first when a year is opened
  if (scrolledYear !== calYear) {
    const sc = document.querySelector(".cal-scroll");
    sc.scrollLeft = calYear === new Date().getFullYear() ? sc.scrollWidth : 0;
    scrolledYear = calYear;
  }
  document.getElementById("cal-title").textContent = `${total} incident${total === 1 ? "" : "s"} disclosed in ${calYear}`;
}

function render() {
  const q = document.getElementById("q").value.toLowerCase();
  let rows = data.filter(r => {
    if (selDate && r["Disclosed on"] !== selDate) return false;
    if (q && !COLS.some(c => (r[c.key] || "").toLowerCase().includes(q))) return false;
    return COLS.every(c => {
      const f = filters[c.key];
      if (!f) return true;
      const v = r[c.key] || "";
      if (c.type === "select") return (c.derive ? c.derive(v) : v) === f;
      return v.toLowerCase().includes(f.toLowerCase());
    });
  });
  const col = COLS.find(c => c.key === sortKey);
  const val = r => {
    const v = r[sortKey] || "";
    if (col.date) return Date.parse(v) || 0;
    if (col.num) return parseFloat(v) || 0;
    return v.toLowerCase();
  };
  rows.sort((a, b) => (val(a) > val(b) ? 1 : val(a) < val(b) ? -1 : 0) * sortDir);

  const tbody = document.getElementById("rows");
  tbody.innerHTML = "";
  for (const r of rows) {
    const tr = document.createElement("tr");
    tr.className = companyGroup(r["Company"] || "").toLowerCase();
    for (const c of COLS) {
      const td = document.createElement("td");
      if (c.links) {
        for (const src of r._sources) {
          const a = document.createElement("a");
          a.href = src.URL; a.target = "_blank"; a.rel = "noopener";
          a.textContent = src.Publisher || src["Source title"] || src.URL;
          a.title = src["Source title"] || src.URL;
          td.appendChild(a);
        }
      } else td.textContent = r[c.key] || "";
      td.dataset.label = c.label || c.key;
      if (c.long) td.className = "long";
      tr.appendChild(td);
    }
    tbody.appendChild(tr);
  }
  // Keep the colour labels and the Company dropdown in sync with the active filter
  const legend = document.querySelector(".legend");
  legend.classList.toggle("filtering", !!filters.Company);
  legend.querySelectorAll("button").forEach(b => b.classList.toggle("active", b.dataset.company === filters.Company));
  const sel = document.querySelector('#filters select[data-key="Company"]');
  if (sel) sel.value = filters.Company || "";
  document.querySelectorAll("#heads th").forEach((th, i) => {
    th.querySelector(".arrow").textContent = COLS[i].key === sortKey ? (sortDir > 0 ? " ▲" : " ▼") : "";
  });
  document.getElementById("status").textContent = `Showing ${rows.length} of ${data.length} incidents${selDate ? " disclosed on " + fmt(selDate) : ""} · ${source}`;
  renderCal();
}

function buildHeader() {
  const heads = document.getElementById("heads"), frow = document.getElementById("filters");
  for (const c of COLS) {
    const th = document.createElement("th");
    th.innerHTML = `<span></span><span class="arrow"></span>`;
    th.firstChild.textContent = c.label || c.key;
    th.onclick = () => { sortDir = sortKey === c.key ? -sortDir : 1; sortKey = c.key; render(); };
    heads.appendChild(th);

    const fh = document.createElement("th");
    // Only categorical columns get a filter; the search box covers free text.
    if (c.type === "select") {
      const el = document.createElement("select");
      const opts = [...new Set(data.map(r => c.derive ? c.derive(r[c.key] || "") : r[c.key]).filter(Boolean))].sort();
      el.innerHTML = `<option value="">All ${c.plural || "values"}</option>`;
      for (const o of opts) { const op = document.createElement("option"); op.value = op.textContent = o; el.appendChild(op); }
      el.dataset.key = c.key;
      el.onchange = () => { filters[c.key] = el.value; render(); };
      fh.appendChild(el);
    }
    frow.appendChild(fh);
  }
}

document.getElementById("q").oninput = render;
document.querySelectorAll(".legend button").forEach(b => b.onclick = () => {
  filters.Company = filters.Company === b.dataset.company ? "" : b.dataset.company;
  render();
});
document.getElementById("reset").onclick = () => {
  document.getElementById("q").value = "";
  document.querySelectorAll("#filters input, #filters select").forEach(el => el.value = "");
  for (const k in filters) delete filters[k];
  selDate = "";
  render();
};

const parse = url => new Promise((resolve, reject) => Papa.parse(url, {
  download: true, header: true, skipEmptyLines: true,
  complete: res => res.data.length && "Incident ID" in res.data[0] ? resolve(res.data) : reject(new Error("bad data")),
  error: reject
}));

// Live from Google first; if the browser blocks that (ad/privacy blockers), use the snapshot synced into the repo.
let source = "live from Google Sheets";
const loadAll = () => Promise.all([parse(SHEET + INCIDENTS_GID + "&t=" + Date.now()), parse(SHEET + SOURCES_GID + "&t=" + Date.now())])
  .catch(() => {
    source = "from the latest synced copy of the sheet";
    return Promise.all([parse("data/incidents.csv?t=" + Date.now()), parse("data/sources.csv?t=" + Date.now())]);
  });

loadAll().then(([incidents, sources]) => {
  data = incidents.filter(r => r["Incident ID"]);
  for (const r of data) {
    r._sources = sources.filter(s => s["Incident ID"] === r["Incident ID"] && /^https?:\/\//.test(s.URL || ""));
    // Searchable text for the Sources column
    r.Sources = r._sources.map(s => [s.Publisher, s["Source title"], s.URL].join(" ")).join(" ");
  }
  buildHeader();
  render();
}).catch(() => { document.getElementById("status").textContent = "Could not load the spreadsheet."; });
</script>
</body>
</html>
